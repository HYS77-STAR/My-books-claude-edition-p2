name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          set -e
          PUB=$(find . -name pubspec.yaml -not -path './.git/*' | head -1)
          if [ -z "$PUB" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            if [ -z "$ZIP" ]; then
              echo "No pubspec.yaml and no zip found"
              ls -R | head -50
              exit 1
            fi
            mkdir unz
            unzip -q "$ZIP" -d unz
            PUB=$(find unz -name pubspec.yaml | head -1)
          fi
          DIR=$(dirname "$PUB")
          echo "Project found in: $DIR"
          mkdir app
          rsync -a --exclude .git --exclude app --exclude unz "$DIR"/ app/
          ls -a app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: app
        run: |
          set -e
          mkdir -p /tmp/keep
          cp -r lib pubspec.yaml tools /tmp/keep/
          if [ -d assets ]; then cp -r assets /tmp/keep/; fi

          flutter create . --project-name listen_now --org com.listennow --platforms android

          rm -rf lib assets pubspec.yaml test tools
          cp -r /tmp/keep/lib .
          cp -r /tmp/keep/tools .
          cp /tmp/keep/pubspec.yaml .
          if [ -d /tmp/keep/assets ]; then cp -r /tmp/keep/assets .; fi

      - name: Patch Android manifest (app name and permissions)
        working-directory: app
        run: python3 tools/patch_android.py

      - name: Fix missing Cupertino import
        working-directory: app
        run: |
          F=lib/theme/app_theme.dart
          if [ -f "$F" ] && ! grep -q "flutter/cupertino.dart" "$F"; then
            sed -i "1i import 'package:flutter/cupertino.dart';" "$F"
            echo "Added cupertino import to $F"
          fi

      - name: Skip lint-vital
        run: |
          mkdir -p $HOME/.gradle/init.d
          cat > $HOME/.gradle/init.d/skip-lint.gradle <<'GRADLE'
          allprojects {
              tasks.whenTaskAdded { task ->
                  if (task.name.startsWith('lintVital') || task.name.startsWith('lintAnalyze')) {
                      task.enabled = false
                  }
              }
          }
          GRADLE

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Generate app icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: ListenNow-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
